name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Set APK path
        run: echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MindFlow-debug.apk
          path: ${{ env.APK_PATH }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          tag_name: v1.0.0-${{ github.run_number }}
          name: MindFlow v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## MindFlow
            Auto-built via GitHub Actions

            ### Download:
            - Android APK (see Assets below)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
